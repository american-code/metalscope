name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-latest is arm64 (Apple silicon) on GitHub-hosted runners.
    name: swift build + test (macOS arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and architecture
        run: |
          swift --version
          uname -m
          sw_vers

      # What a hosted runner exposes is not something the runner image
      # documents, and it has changed before. Record the answer in the log
      # rather than assuming it. As of this writing macos-latest reports an
      # "Apple Paravirtual device" that exposes *no* counter sets at all — not
      # even `timestamp` — and supports dispatch/blit but not stage-boundary
      # sampling, which is the mirror image of every real Apple part. Capture
      # therefore falls to command-buffer GPU time and the stage-sampling tests
      # XCTSkip, which is the degradation path working. The job is green whether
      # or not a device is present; this step is how you tell which case it was.
      - name: Metal device availability
        run: |
          cat > /tmp/metal-probe.swift <<'SWIFT'
          import Metal
          if let device = MTLCreateSystemDefaultDevice() {
              print("metal-device: \(device.name)")
              print("counter-sets: \((device.counterSets ?? []).map(\.name).joined(separator: ",")) ")
          } else {
              print("metal-device: none — GPU-dependent tests will skip")
          }
          SWIFT
          swiftc -O /tmp/metal-probe.swift -o /tmp/metal-probe
          /tmp/metal-probe

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release

      # The CLI target is not covered by XCTest (XCTest does not link an
      # executable target), so exercise it here. `info` runs without a Metal
      # device; the rest need one, so they are gated on the probe above.
      #
      # `calibrate` is not optional here. The runner's GPU has no entry in the
      # spec-sheet folklore table, so `report` correctly refuses to score
      # against peaks it does not have — which means measuring them is part of
      # the smoke test, exactly as it is for a user on a new machine. It writes
      # to a temp file rather than ~/.metalscope so nothing leaks between steps.
      - name: Smoke-test the CLI
        run: |
          set -o pipefail
          BIN=./.build/release/metalscope
          $BIN version
          $BIN help
          if /tmp/metal-probe | grep -q "metal-device: none"; then
            echo "no Metal device on this runner — skipping the capture commands"
            $BIN info || echo "info exited non-zero, as expected without a device"
            exit 0
          fi

          PEAKS="$RUNNER_TEMP/peaks.json"
          $BIN info
          $BIN calibrate --quick --sizes 512 --triad-mb 32 --skip-fp16 \
            --target-ms 40 --peaks-file "$PEAKS"
          for name in a b; do
            $BIN bench --variant baseline --repeats 3 --target-ms 20 \
              --size 256 --seq 128 --heads 4 --elements-mb 4 \
              --output "$RUNNER_TEMP/$name.json"
          done
          $BIN report "$RUNNER_TEMP/a.json" --peaks-file "$PEAKS"
          $BIN diff "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json" --peaks-file "$PEAKS"

          # The v3 additions must actually be in the trace, and the derived
          # summary must not be: a green build that silently stopped recording
          # samples would look exactly like a passing run otherwise.
          python3 - "$RUNNER_TEMP/a.json" <<'PY'
          import json, sys
          trace = json.load(open(sys.argv[1]))
          assert trace["schemaVersion"] == 3, trace["schemaVersion"]
          for k in trace["kernels"]:
              samples = k.get("durationSamplesSeconds")
              assert samples and len(samples) == 3, (k["label"], samples)
              assert "median" not in k and "runStatistics" not in k, k["label"]
              assert k["durationSeconds"] == sorted(samples)[1], k["label"]
          print(f"trace v3 OK: {len(trace['kernels'])} kernels, 3 samples each, median stored as durationSeconds")
          PY
